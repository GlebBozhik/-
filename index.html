<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
        <title>Document</title>
        <style>
            .header-section {
                background-color: #f3f3f3;
                width: 100%;
                text-align: center;
                padding: 60px 0 40px 0;
                border-bottom: 2px solid #000;
            }

            .logo {
                font-size: 3.5rem;
                font-weight: 300;
                letter-spacing: 2px;
                margin: 0;
                text-transform: uppercase;
            }

            .logo span {
                font-family: 'Courier New', Courier, monospace;
                font-weight: bold;
            }

            .subtitle {
                font-style: italic;
                font-size: 1.2rem;
                margin-top: 15px;
                color: #333;
            }
            .cta-button {
                margin-top: 25px;
                padding: 12px 30px;
                font-size: 1rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #fff;
                background-color: #000;
                border: 2px solid #000;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .cta-button:hover {
                background-color: transparent;
                color: #000;
            }
    </style>
    </head>
    <body>
        <header>
            <div class="header-section">
                <h1 class="logo">Grobov<span>&radic;(-1)</span>k</h1>
                <div class="subtitle">Генератор 18-ых заданий ЕГЭ по проф. мату</div>
                <button class="cta-button">BlaBlaBla</button>
            </div>
        </header>
        <main>
            <section class="grobiki">
                <ul>
                    <li>
                        <a class="grob"><img src="grob_na_hellouin_nqhoahdcwvih 1.png"></a>
                    </li>
                    <li>
                        <a class="grob"><img src="grob_na_hellouin_nqhoahdcwvih 2.png"></a>
                    </li>
                    <li>
                        <a class="grob"><img src="grob_na_hellouin_nqhoahdcwvih 3.png"></a>
                    </li>
                </ul>
            </section>
        </main>
    </body>
